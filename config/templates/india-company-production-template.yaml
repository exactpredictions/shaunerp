    registrationNumber: ""
    isActive: false
  - registrationType: UDYAM
    registrationNumber: ""
    isActive: false
  - registrationType: IEC
    registrationNumber: ""
    isActive: false

currencies:
  - currencyCode: INR
    currencyName: Indian Rupee
    symbol: "₹"
    decimalPlaces: 2
    isBaseCurrency: true
    isActive: true

accountingSettings:
  inventoryEnabled: false
  valuationMethod: WeightedAverage
  negativeStockAllowed: false
  stockAccountingEnabled: false
  autoCreateCustomerLedger: true
  autoCreateSupplierLedger: true
  autoPostSalesInvoice: true
  defaultCashLedgerCode: CASH
  defaultBankLedgerCode: BANK
  defaultSalesLedgerCode: SALES
  defaultArLedgerCode: AR
  defaultApLedgerCode: AP
