    - Duties & Taxes
    - GST Payable
    - TDS Payable
    - Loans
    - Equity
    - Share Capital
    - Reserves & Surplus
    - Retained Earnings
    - Income
    - Sales
    - Service Income
    - Other Income
    - Expenses
    - Purchases
    - Direct Expenses
    - Employee Expenses
    - Administrative Expenses
    - Selling Expenses
    - Finance Costs
    - Depreciation
    - Other Expenses
  recommendedLedgerCodes:
    - CASH
    - BANK
    - AR
    - AP
    - SALES
    - PURCHASE
    - CGST-IN
    - SGST-IN
    - IGST-IN
    - CGST-OUT
    - SGST-OUT
    - IGST-OUT
    - RETAINED
    - CAPITAL
    - INVENTORY
    - COGS
    - ROUNDOFF
  notes:
