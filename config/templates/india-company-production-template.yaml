    - Do not store passwords, JWT secrets, or infrastructure credentials in this file.

statutoryRegistrations:
  - registrationType: CIN
    registrationNumber: ""
    isActive: true
  - registrationType: PAN
    registrationNumber: ""
    isActive: true
