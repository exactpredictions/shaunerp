# Company site — shauninfomedia.com (HTTP; certbot will add SSL)
server {
    listen 80;
    listen [::]:80;
    server_name shauninfomedia.com www.shauninfomedia.com;

    root /var/www/shauninfomedia/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/shauninfomedia.access.log;
    error_log  /var/log/nginx/shauninfomedia.error.log;
}
